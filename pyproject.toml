[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stemcheck"
version = "0.1.0a1"
description = "Check separated music stems: do they add up to the mix, are any silent, clipped or duplicated, and how much of one instrument leaks into another (measured against reference stems)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Boobalan Arjunan" }]
maintainers = [{ name = "Boobalan Arjunan" }]
keywords = ["audio", "music", "source-separation", "stems", "bleed", "interference", "evaluation", "quality-check", "machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy", "scipy", "soundfile"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/BoobalanArjunan/stemcheck"
Issues = "https://github.com/BoobalanArjunan/stemcheck/issues"
Source = "https://github.com/BoobalanArjunan/stemcheck"

[project.scripts]
stemcheck = "stemcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
